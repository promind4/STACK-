<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="gold-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C58C" />
      <stop offset="100%" stop-color="#D3B27B" />
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700&amp;display=swap');
      .text { font-family: 'Inter', sans-serif; font-weight: 700; fill: #0F0F0F; }
      .text-pro { font-family: 'Inter', sans-serif; font-weight: 700; fill: #D3B27B; letter-spacing: 0.1em; }
    </style>
  </defs>

  <!-- Icon Section (Left) -->
  <g transform="translate(0, 20) scale(0.3)">
    <!-- Same geometry as favicon but standalone without circle or with minimal container -->
    <!-- Let's use the Icon directly -->
    <!-- Vertical Bar -->
    <rect x="0" y="0" width="100" height="512" rx="50" fill="url(#gold-gradient)"/>
    <!-- Top Bar -->
    <rect x="140" y="0" width="280" height="100" rx="50" fill="url(#gold-gradient)"/>
    <!-- Middle Bar -->
    <rect x="140" y="190" width="180" height="100" rx="50" fill="url(#gold-gradient)"/>
    <!-- Bottom Accent -->
    <circle cx="190" cy="462" r="50" fill="url(#gold-gradient)" opacity="0.5"/>
  </g>

  <!-- Text Section (Right) -->
  <text x="160" y="135" font-size="120" class="text">Fluxlab</text>
  
</svg>
