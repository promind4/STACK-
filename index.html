<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Config Studio | Construisez votre espace de création</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              border: "hsl(var(--border))",
              input: "hsl(var(--input))",
              ring: "hsl(var(--ring))",
              background: "hsl(var(--background))",
              foreground: "hsl(var(--foreground))",
              primary: {
                DEFAULT: "hsl(var(--primary))",
                foreground: "hsl(var(--primary-foreground))",
              },
              secondary: {
                DEFAULT: "hsl(var(--secondary))",
                foreground: "hsl(var(--secondary-foreground))",
              },
              destructive: {
                DEFAULT: "hsl(var(--destructive))",
                foreground: "hsl(var(--destructive-foreground))",
              },
              muted: {
                DEFAULT: "hsl(var(--muted))",
                foreground: "hsl(var(--muted-foreground))",
              },
              accent: {
                DEFAULT: "hsl(var(--accent))",
                foreground: "hsl(var(--accent-foreground))",
              },
              popover: {
                DEFAULT: "hsl(var(--popover))",
                foreground: "hsl(var(--popover-foreground))",
              },
              card: {
                DEFAULT: "hsl(var(--card))",
                foreground: "hsl(var(--card-foreground))",
              },
            },
            borderRadius: {
              lg: "var(--radius)",
              md: "calc(var(--radius) - 2px)",
              sm: "calc(var(--radius) - 4px)",
            },
            backgroundImage: {
              'gradient-radial': 'radial-gradient(var(--tw-gradient-stops))',
            }
          },
        },
      }
    </script>
    <style>
      :root {
        /* 
          Palette Config Studio - Atelier Premium 
          Style lumineux, crémeux et apaisant.
        */

        --background: 0 0% 98%;       /* #FAFAFA - Blanc cassé lumineux */
        --foreground: 0 0% 6%;        /* #0F0F0F - Noir Premium */
        
        --card: 0 0% 100%;            /* #FFFFFF - Cartes blanches pour le contraste */
        --card-foreground: 0 0% 6%;
        
        --popover: 0 0% 100%;
        --popover-foreground: 0 0% 6%;
        
        --primary: 38 52% 65%;        /* #D3B27B - Or Doux */
        --primary-foreground: 0 0% 100%; /* Blanc sur Or */
        
        --secondary: 30 24% 94%;      /* #F4EFEA - Surface Crème (Key Color) */
        --secondary-foreground: 0 0% 6%;
        
        --muted: 40 38% 84%;          /* #E8DCC4 - Sable */
        --muted-foreground: 0 0% 44%; /* #6F6F6F - Gris chaud */
        
        --accent: 40 38% 84%;         /* #E8DCC4 - Sable */
        --accent-foreground: 0 0% 6%;
        
        --destructive: 0 84.2% 60.2%;
        --destructive-foreground: 0 0% 98%;
        
        --border: 40 38% 84%;         /* #E8DCC4 - Bordures Sable douces */
        --input: 40 38% 84%;
        --ring: 38 52% 65%;           /* Or doux pour le focus */
        
        --radius: 1rem;               /* rounded-2xl */
      }
      
      body {
        font-family: "Inter", sans-serif;
        background-color: hsl(var(--background));
        color: hsl(var(--foreground));
      }

      /* Utilitaires de sélection */
      ::selection {
        background-color: hsl(var(--muted));
        color: hsl(var(--foreground));
      }

      /* Scrollbar fine et élégante */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: hsl(var(--background));
      }
      ::-webkit-scrollbar-thumb {
        background: hsl(var(--border));
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: hsl(var(--primary));
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.2",
    "react-dom/": "https://esm.sh/react-dom@^19.2.2/",
    "react/": "https://esm.sh/react@^19.2.2/",
    "lucide-react": "https://esm.sh/lucide-react@^0.560.0",
    "framer-motion": "https://esm.sh/framer-motion@^12.23.26"
  }
}
</script>
</head>
  <body class="antialiased">
    <div id="root"></div>
  </body>
</html>
