# seo-autopilot — site profile for FLUXLAB (promind4/STACK-)
# Filled 2026-09-21. Fields verified directly against the repo code unless noted.
#
# SANDBOX LIMITATION (2026-09-21): scripts/post-publish-verify.mjs's image-check step uses
# Node's raw https module, which does not go through this Claude Code on the web sandbox's
# egress proxy the way curl does. Confirmed: Node gets a synthetic 403 "host_not_allowed"
# from the LOCAL proxy on *any* external image URL (tested both a Thomann CDN URL and a
# Supabase storage URL, including images already live in production before any edit),
# while the identical request via curl succeeds and returns the real CDN response. This
# means the image-check portion of the smoke test cannot pass in this sandbox regardless
# of whether the images are actually broken — verify external images manually with curl
# instead, and treat that as the real signal. Internal links and the localhost HTTP check
# are unaffected (no proxy involved for localhost).

site:
  name: Fluxlab
  url: https://www.fluxlab.fr
  locale: fr-FR
  vertical: "Home studio / podcast / streaming creator audio gear — buying guides plus a product catalog (mics, interfaces, headphones, cameras)"

repo:
  path: /home/user/STACK-
  remote: https://github.com/promind4/STACK-
  branches:
    work: master                          # confirmed: PR #1, #2, #3 all merged into master; it is also the repo's default (HEAD) branch
    prod: master                          # no separate deploy branch found — `main` exists but is a stale/divergent branch (53 commits behind master, 8 ahead on its own history) and is NOT where merges have landed
    protected: [master]
    history: seo-agent/history            # confirmed: already exists on origin, holds changes.jsonl / design-snapshots.jsonl / gsc-snapshots.jsonl

content:
  adapter: nextjs-inline-array
  source_file: lib/data.ts
  array_name: ARTICLES                    # confirmed: `export const ARTICLES: Article[] = [...]` at lib/data.ts:36
  route_pattern: app/guide/[slug]/page.tsx
  known_duplicate_systems: []
  niche_keyword_bias: true

design:
  watch_paths: ["app/globals.css", "tailwind.config.ts", "components/ui/**"]

quality:
  max_revision_rounds: 2

catalog:
  adapter: supabase-products
  tables_or_endpoints: ["products", "categories", "product_offers"]
  # LIVE-VERIFIED 2026-09-21 via REST (previously blocked, network policy fixed by AZURA mid-session):
  #   products        - no `price` column (contrary to what lib/pricing/index.ts's .update({price:...}) call implies —
  #                      either PostgREST's schema cache is stale or the app has a real schema-drift bug; worth AZURA
  #                      checking directly in Supabase). Has `is_active` — 9 products currently is_active=false.
  #   categories      - confirmed live (id, name, slug, parent_id, vertical, is_active, display_order, ...)
  #   product_offers  - THIS is where price actually lives: price, original_price, currency, in_stock, merchant_name, priority
  #   price_history   - DOES NOT EXIST (PGRST205 "table not found in schema cache"). lib/pricing/index.ts inserts into
  #                      it, so either the insert silently no-ops/errors in prod, or the table was dropped/never
  #                      migrated. Removed from tables_or_endpoints above since it isn't real — do not diff against it.
  price_history_reliable: false           # now confirmed false, not just a conservative default: the table doesn't exist
  known_issues:
    - "Supabase credentials available in this environment are SUPABASE_URL / SUPABASE_ANON_KEY, which do NOT match the names the app code reads (NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY — see lib/supabase.ts, lib/pricing/index.ts, app/api/cron/update-prices/route.ts). Fine for the agent querying the REST API directly with URL+anon key, but do not assume these env vars work if a script imports the app's own lib/supabase.ts helpers."
    - "price_history table referenced in lib/pricing/index.ts does not exist in Supabase (confirmed live 2026-09-21, PGRST205). Price-trend claims in articles cannot be backed by real history data until this is fixed app-side — AZURA to investigate whether updatePrices() is failing silently on this insert."
    - "products.price column referenced in lib/pricing/index.ts's updatePrices() does not exist on the live products table (confirmed live 2026-09-21) — real per-merchant prices live on product_offers.price instead. Same silent-failure question as price_history."

data_sources_for_differentiation:
  proprietary_available: false
  fallback_methods: ["multi-merchant price comparison via product_offers at time of writing", "documented expert criteria"]

analytics:
  gsc_property: "sc-domain:fluxlab.fr"    # confirmed live via scripts/gsc-fetch.py --site — the https:// URL-prefix form returned 0 rows, the site is verified in GSC as a domain property
  ga4_property_id: "530141900"            # confirmed: default in seo-autopilot/scripts/ga4-fetch.py --property-id
  mcp:
    gsc: null                             # no GSC MCP configured — access is via scripts/gsc-fetch.py (service account), not an MCP server
    ga4: null                             # no GA4 MCP configured — access is via scripts/ga4-fetch.py (service account), not an MCP server

data_hygiene:
  target_countries:
    - "France"
  exclude_internal_cities: []             # AZURA to fill: dev/founder city to exclude from analytics as self-visits (left empty, not a placeholder — degraded mode until filled)
  min_engagement_duration_sec: 5

market_watch:
  enabled: true
  brands:
    - "Shure"
    - "Focusrite"
    - "Rode"
    - "Elgato"
    - "Audient"
    - "Universal Audio"
    - "Sony"
    - "Beyerdynamic"
  verticals:
    - "microphones"
    - "audio-interfaces"
    - "headphones"
    - "streaming-cameras"

goal:
  # Changed 2026-09-21 per AZURA: net-new content is now this agent's PRIMARY job,
  # not corrections. He explicitly wants us to avoid "s'éparpiller" (spreading thin) —
  # price/catalog monitoring is meant to live in a separate, dedicated tool/agent
  # eventually (not built yet); until then, treat factual-drift/slug/cannibalization
  # fixes as secondary work done opportunistically alongside content, never as a
  # reason to skip a scheduled article. close-content-gaps (= writing new articles)
  # is promoted above consolidate-striking-distance accordingly. fix-factual-drift
  # stays first per the skill's own invariant (an inaccurate article is a liability
  # regardless of strategy) but these are meant to be quick, not cycle-blocking.
  mode: keyword-targeted
  priority_order:
    - fix-factual-drift
    - close-content-gaps
    - consolidate-striking-distance
    - build-authority-clusters

cadence:
  # AZURA wants a firm floor, not a range: a new article published on each of
  # 2 fixed days per week, set 2026-09-21. He left the exact days to Claude's
  # judgment; Monday + Thursday matches the automation trigger's actual
  # schedule (trig_01YJZeLoFguHusaqjJc2uDC5, "seo flux (master)", cron
  # 0 8 * * 1,4 UTC) so profile and automation stay in sync.
  new_articles_per_week: [2, 2]
  publish_days: ["Monday", "Thursday"]
  cooldown_days_per_target: 7

guardrails:
  never_noindex_automatically: true
  never_major_restructure_automatically: true
  never_scrape_serps: true
  never_expose_secrets: true
  publish_mode: pr-only
  target_branch: master
  history_branch: seo-agent/history

context_files: []
